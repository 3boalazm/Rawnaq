[package]
name = "rawnaq-core"
version = "0.1.0"
edition = "2021"
description = "Rawnaq audio core: decode, repair, denoise, quality gate, export. No UI."
license = "MIT OR Apache-2.0"

[lib]
name = "rawnaq_core"
path = "src/lib.rs"

[[bin]]
name = "rawnaq-cli"
path = "src/bin/cli.rs"

[dependencies]
anyhow = "1"
cathar = "0.8"
deep-filter-rt = "0.2"
earshot = "1.2.2"
realfft = "3.5"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-22"] }
hound = "3"
ndarray = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
