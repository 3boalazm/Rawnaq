[package]
name = "rawnaq"
version = "0.1.0"
edition = "2021"
description = "Rawnaq: offline restoration of old Quran recitation recordings"
license = "MIT OR Apache-2.0"

[lib]
name = "rawnaq_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rawnaq-core = { path = "../crates/rawnaq-core" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
